<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lunaria — the daily ascent</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- START SCREEN -->
  <section id="screen-start" class="screen">
    <div class="sky">
      <div class="star s1"></div><div class="star s2"></div><div class="star s3"></div>
      <div class="star s4"></div><div class="star s5"></div><div class="star s6"></div>
    </div>
    <div class="moon-bg"></div>
    <h1 class="logo">🌙 Lunaria</h1>
    <p class="tagline">Climb to the Moon with rare answers.</p>
    <p class="rules">
      10 rounds. One keyword (1–2 words) per question.<br>
      The <b>rarer</b> your keyword on Google that month, the higher you climb.<br>
      Diamond <span class="chip diamond">50</span> · Platinum <span class="chip platinum">40</span> ·
      Gold <span class="chip gold">30</span> · Silver <span class="chip silver">20</span> · Bronze <span class="chip bronze">10</span>
    </p>
    <button id="btn-start" class="btn">🚀 Launch</button>
  </section>

  <!-- GAME SCREEN -->
  <section id="screen-game" class="screen hidden">
    <div class="hud">
      <span id="hud-round">Round 1/10</span>
      <span id="hud-altitude">40,000 km</span>
      <span id="hud-points">0 pts</span>
    </div>
    <div id="track-wrap">
      <div id="track-earth">🌍</div>
      <div id="track">
        <div id="progress-line"><div id="progress-fill"></div></div>
        <div id="ship">🚀</div>
        <div id="moon-icon">🌕</div>
      </div>
    </div>
    <div class="card" id="question-card">
      <div id="question-text">Loading…</div>
      <input id="answer-input" autocomplete="off" maxlength="40" placeholder="one or two words…">
      <button id="btn-submit" class="btn">Ascend ⬆</button>
    </div>
    <div id="reveal" class="card hidden">
      <div id="tier-badge"></div>
      <div id="tier-info"></div>
      <button id="btn-next" class="btn">Next ▸</button>
    </div>
  </section>

  <!-- RESULTS SCREEN -->
  <section id="screen-results" class="screen hidden">
    <div class="moon-bg"></div>
    <h1 id="result-title">Mission complete 🌕</h1>
    <p id="result-summary"></p>
    <ul id="history-list"></ul>
    <button id="btn-restart" class="btn">Play again ↺</button>
  </section>

</div>
<script src="js/data.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
